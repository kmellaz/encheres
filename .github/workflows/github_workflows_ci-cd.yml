name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        run: |
          cd backend/encheres-service
          mvn clean package
      
      - name: Run tests
        run: |
          cd backend/encheres-service
          mvn test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/encheres-frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend/encheres-frontend
          npm ci
      
      - name: Build
        run: |
          cd frontend/encheres-frontend
          npm run build
      
      - name: Run tests
        run: |
          cd frontend/encheres-frontend
          npm run test -- --run

  docker-build:
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/encheres-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/encheres-backend:latest
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/encheres-frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/encheres-frontend:latest