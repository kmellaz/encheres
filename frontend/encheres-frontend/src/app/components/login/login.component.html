<div class="d-flex align-items-center justify-content-center h-100 p-4 p-md-5">
  <div class="w-100" style="max-width: 420px;">
    <div class="text-center mb-4">
      <h3 class="fw-bold mb-2">Connexion</h3>
      <p class="text-muted mb-0">Accédez à votre espace sécurisé</p>
    </div>

    <div *ngIf="msgErreur() as erreur" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
      <strong>Erreur !</strong> {{ erreur }}
    </div>

    <form (ngSubmit)="authenticate()">
      <div class="mb-3">
        <label for="login" class="form-label">Login</label>
        <input
          type="text"
          class="form-control form-control-lg"
          id="login"
          name="login"
          [(ngModel)]="login"
          placeholder="Votre login"
        />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Mot de passe</label>
        <input
          type="password"
          class="form-control form-control-lg"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
        />
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe" />
          <label class="form-check-label small" for="rememberMe">
            Se souvenir de moi
          </label>
        </div>
        <a href="#" class="small text-primary text-decoration-none">
          Mot de passe oublié ?
        </a>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
        Se connecter
      </button>

      <div class="text-center text-muted small mb-3">ou</div>

      <a href="#" class="btn btn-outline-secondary w-100">
        Créer un compte
      </a>
    </form>

  </div>
</div>
